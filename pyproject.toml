[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-calendar-mcp"
version = "0.1.0"
description = "Google Calendar MCP server for Claude Desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Dmytro Romanov" }
]
keywords = ["calendar", "google-calendar", "mcp", "claude", "scheduling", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth>=2.23.0",
    "fastmcp>=3.4.4,<4.0.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
cloud = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
    # Shared OAuth 2.1 authorization server for the claude.ai custom connector (replaces the
    # copy that used to live in src/google_calendar/mcp_oauth.py). PUBLIC repo, so it fetches
    # over https with no key. Pinned by SHA: keep this rev identical across all MCP servers,
    # bump it deliberately. Written as a PEP 508 direct reference rather than
    # [tool.uv.sources] because this image builds with pip, which does not read that section.
    # Pulls fastapi + pyjwt + python-multipart, so it belongs here and not in the stdio-only
    # base dependencies; it requires Python >=3.11 (the image is 3.12).
    "mcp-oauth @ git+https://github.com/DimaRmnv/mcp-oauth.git@d4f56fcb62143c928cd0405bc4148a5e3963f1ab",
]

[project.scripts]
google-calendar-mcp = "google_calendar.__main__:main"

[project.urls]
Homepage = "https://github.com/DimaRmnv/G-calendar-mcp"
Repository = "https://github.com/DimaRmnv/G-calendar-mcp"

[tool.hatch.metadata]
# The cloud extra pins mcp-oauth as a PEP 508 direct reference (git+https, SHA-pinned).
# Hatchling rejects direct references outright unless this is on, and the build fails
# with "cannot be a direct reference" — which is a build-time failure of the image.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/google_calendar"]

[tool.hatch.build.targets.sdist]
include = ["src/google_calendar"]

[tool.hatch.build]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
