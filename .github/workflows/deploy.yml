name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the runtime image (Dockerfile: python:3.12-slim) so the gate
          # exercises the interpreter that actually ships.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # cloud extras carry fastapi/starlette and the SHA-pinned mcp-oauth
        # dependency the OAuth tests import; dev carries pytest and pyyaml.
        run: pip install -e ".[cloud,dev]"

      - name: Run tests
        run: pytest tests/ -q

  deploy:
    # Deploy gate: the server is not touched -- not even the SSH key written --
    # unless the suite is green. A separate job rather than a first step, so a
    # later edit cannot slip a server-touching step in ahead of the tests.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'credentials' \
            --exclude 'client_secrets' \
            --exclude 'data' \
            src Dockerfile pyproject.toml README.md docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/apps/google-calendar-mcp/

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            cd ~/apps/google-calendar-mcp
            cp docker-compose.prod.yml docker-compose.yml
            docker compose build --quiet
            docker compose up -d
            echo "Deploy complete!"
            docker compose ps
          '

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            cd ~/apps/google-calendar-mcp

            # PostgreSQL: Create database if not exists
            docker exec shared-postgres psql -U travel -tc "SELECT 1 FROM pg_database WHERE datname = '\''google_calendar_mcp'\''" | grep -q 1 || \
              docker exec shared-postgres psql -U travel -c "CREATE DATABASE google_calendar_mcp"

            # PostgreSQL: Apply schema migrations (all tables now in PostgreSQL)
            docker exec -i shared-postgres psql -U travel -d google_calendar_mcp < src/google_calendar/db/schema.sql 2>&1 || true

            echo "PostgreSQL migrations complete!"
          '
